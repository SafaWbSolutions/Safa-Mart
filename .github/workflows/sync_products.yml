name: Sync affiliate products

on:
  schedule:
    # Every 4 hours, at minute 0 (UTC).
    - cron: "0 */4 * * *"
  # Scraper/category changes should fix the catalogue immediately instead of
  # waiting for the next 4-hour slot.
  push:
    branches: [main]
    paths:
      - "automation/**"
      - ".github/workflows/sync_products.yml"
  workflow_dispatch:
    inputs:
      max_products:
        description: "Maximum new products to publish in this run"
        required: false
        default: "30"
      skip_stock_check:
        description: "Skip checking existing products for broken links/stock"
        required: false
        type: boolean
        default: true
      min_discount:
        description: "Minimum discount percent for new products (best-deal filter)"
        required: false
        default: "40"

permissions:
  contents: read

concurrency:
  group: safa-mart-product-sync
  # Manual trigger ke waqt pehle wala run cancel na ho; naya run queue mein rahe.
  cancel-in-progress: false

jobs:
  sync:
    name: Scrape, upload images and upsert products
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
      UPLOAD_API_SECRET: ${{ secrets.UPLOAD_API_SECRET }}
      EARNKARO_TOKEN: ${{ secrets.EARNKARO_TOKEN }}
      EARNKARO_API_URL: ${{ secrets.EARNKARO_API_URL }}
      FEED_URLS: ${{ secrets.FEED_URLS }}
      # Route merchant fetches through the Indian web server; GitHub runners
      # are outside India and Myntra serves them a page with no product links.
      FETCH_PROXY_URL: ${{ secrets.SITE_URL }}/api/feed.php
      MAX_PRODUCTS: ${{ github.event.inputs.max_products || '60' }}
      PRODUCTS_PER_FEED: "10"
      STOCK_CHECK_LIMIT: "50"
      SKIP_STOCK_CHECK: ${{ github.event.inputs.skip_stock_check || 'true' }}
      MIN_DISCOUNT_PERCENT: ${{ github.event.inputs.min_discount || '40' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "automation/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r automation/requirements.txt

      - name: Check configuration presence
        run: |
          python - <<'PY'
          import os
          required = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_KEY",
              "SITE_URL",
              "UPLOAD_API_SECRET",
          ]
          missing = [name for name in required if not (os.getenv(name) or "").strip()]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))
          print("Configuration present. Feed override:", bool((os.getenv("FEED_URLS") or "").strip()))
          print("Fetch proxy:", bool((os.getenv("FETCH_PROXY_URL") or "").strip()))
          print("EarnKaro token present:", bool((os.getenv("EARNKARO_TOKEN") or "").strip()))
          PY

      - name: Run product sync
        run: python automation/scraper.py

      # Feed sync writes straight to Supabase, so it never triggered the
      # Telegram-only push announce. Tell the site which products are new and
      # let it send one encrypted Web Push burst to subscribers.
      - name: Announce new deals by push
        if: success()
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          UPLOAD_API_SECRET: ${{ secrets.UPLOAD_API_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$UPLOAD_API_SECRET" ]; then
            echo "Push announce skipped: SITE_URL or UPLOAD_API_SECRET is missing."
            exit 0
          fi
          base="${SITE_URL%/}"
          code=$(curl -sS -o /tmp/safa-push.json -w "%{http_code}" -X POST \
            -H "X-Api-Secret: $UPLOAD_API_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$base/api/push.php?action=announce" || echo "000")
          echo "Push announce HTTP $code"
          if [ -f /tmp/safa-push.json ]; then
            cat /tmp/safa-push.json || true
          fi
          # A push failure must never fail the sync run.
          exit 0

      - name: Summarise sync result
        if: always()
        run: |
          echo "## Safa Mart sync summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f automation/sync.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "Prepared:|Upserted|Skipped|Feed failed|Feed returned|Sync finished|EarnKaro|image" automation/sync.log | tail -n 60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sync.log not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the sync finished
        if: always()
        run: |
          if [ ! -f automation/sync.log ]; then
            echo "::warning::sync.log missing; skipping the result check."
            exit 0
          fi
          if grep -q "\[dry-run\]" automation/sync.log; then
            exit 0
          fi
          if grep -q "Sync finished successfully" automation/sync.log; then
            if grep -q "Prepared:" automation/sync.log; then
              echo "Products were prepared this run."
            else
              echo "::notice::No new best deals this run. The sync completed normally."
            fi
            exit 0
          fi
          echo "::error::The sync did not finish. Open the sync.log artifact for details."
          exit 1

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: safa-mart-sync-log
          path: |
            automation/sync.log
            automation/sync.log.1
          if-no-files-found: ignore
          retention-days: 7
